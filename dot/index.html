<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dot Static Page</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Static Equivalent of dot/app.py</h1>
      <p>
        The Flask app in <code>dot/app.py</code> serves <code>index.html</code> at
        the root route (<code>/</code>). GitHub Pages cannot run Flask, so this
        static page is the equivalent output.
      </p>
      <div class="meta">
        <span>Route equivalent: <code>/</code></span>
        <span>Runtime: Static HTML + CSS</span>
      </div>
    </section>
  </main>
</body>
</html>
