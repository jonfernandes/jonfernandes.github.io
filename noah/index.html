<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noah Maths Lab - Year 6</title>
  <style>
    :root {
      --bg: #f6fbff;
      --card: #ffffff;
      --ink: #123;
      --brand: #0e7c86;
      --accent: #f6a821;
      --ok: #1f9d55;
      --bad: #d64545;
      --muted: #58717b;
      --shadow: 0 10px 24px rgba(16, 40, 56, 0.12);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 10%, #dff7ff, transparent 38%),
        radial-gradient(circle at 90% 0%, #ffe5b3, transparent 24%),
        linear-gradient(180deg, #f7fcff 0%, #edf7ff 100%);
      min-height: 100vh;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 20px 16px 32px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      color: #05424a;
    }

    .subtitle {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 1rem;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      margin-bottom: 16px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    button, input, select {
      border: 2px solid #c5dde6;
      border-radius: 10px;
      font-size: 1rem;
      padding: 10px 12px;
    }

    button {
      border: none;
      background: var(--brand);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: transform .08s ease, opacity .2s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    .btn-alt { background: var(--accent); color: #222; }
    .btn-ok { background: var(--ok); }

    .hidden { display: none; }

    .q {
      font-size: clamp(1.15rem, 2.4vw, 1.5rem);
      margin: 6px 0 12px;
      font-weight: 700;
    }

    .status {
      min-height: 22px;
      font-weight: 700;
    }

    .good { color: var(--ok); }
    .bad { color: var(--bad); }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 7px 11px;
      border-radius: 999px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .topic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .topic-card {
      border: 2px solid #e4eef3;
      border-radius: 12px;
      padding: 10px;
    }

    .topic-title {
      font-weight: 700;
      margin-bottom: 3px;
    }

    .small { font-size: .92rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Noah Maths Lab</h1>
    <p class="subtitle">Year 6 UK maths: assessment first, then smart practice for weak topics.</p>

    <section class="card" id="intro">
      <p><strong>How this works:</strong> take a quick baseline quiz, then the app picks topics to improve and generates fresh questions.</p>
      <button id="startAssessment">Start Assessment</button>
    </section>

    <section class="card hidden" id="assessmentBox">
      <div class="row">
        <span class="pill" style="background:#0c819f" id="assessmentProgress"></span>
      </div>
      <div class="q" id="assessmentQuestion"></div>
      <div class="row">
        <input id="assessmentAnswer" autocomplete="off" inputmode="decimal" placeholder="Type answer">
        <button id="assessmentSubmit">Check</button>
      </div>
      <div class="status" id="assessmentStatus"></div>
    </section>

    <section class="card hidden" id="resultsBox">
      <h2 style="margin-top:0">Assessment Results</h2>
      <div id="scoreLine"></div>
      <div class="topic-grid" id="topicSummary"></div>
      <div class="row" style="margin-top: 12px;">
        <label for="practiceTopic"><strong>Practice topic:</strong></label>
        <select id="practiceTopic"></select>
        <button id="beginPractice" class="btn-alt">Start Practice</button>
      </div>
    </section>

    <section class="card hidden" id="practiceBox">
      <div class="row">
        <span class="pill" style="background:#1f9d55" id="streak">Streak: 0</span>
        <span class="small" id="practiceHint"></span>
      </div>
      <div class="q" id="practiceQuestion"></div>
      <div class="row">
        <input id="practiceAnswer" autocomplete="off" inputmode="decimal" placeholder="Type answer">
        <button id="practiceSubmit" class="btn-ok">Check</button>
        <button id="nextPractice">Next Question</button>
      </div>
      <div class="status" id="practiceStatus"></div>
    </section>
  </div>

  <script>
    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function round2(n) { return Math.round(n * 100) / 100; }
    function norm(s) { return String(s).trim().toLowerCase().replace(/\s+/g, " "); }

    const topics = {
      arithmetic: {
        label: "Arithmetic",
        hint: "Use place value and inverse operations to check quickly.",
        makeQuestion() {
          const mode = randInt(1, 3);
          if (mode === 1) {
            const a = randInt(200, 900), b = randInt(100, 600);
            return { q: `${a} + ${b} = ?`, a: String(a + b) };
          }
          if (mode === 2) {
            const a = randInt(400, 999), b = randInt(110, 399);
            return { q: `${a} - ${b} = ?`, a: String(a - b) };
          }
          const a = randInt(12, 25), b = randInt(4, 12);
          return { q: `${a} × ${b} = ?`, a: String(a * b) };
        }
      },
      fractions: {
        label: "Fractions, Decimals & Percentages",
        hint: "Try converting between fraction, decimal and percent forms.",
        makeQuestion() {
          const mode = randInt(1, 3);
          if (mode === 1) {
            const d = [0.25, 0.5, 0.75, 0.2, 0.1, 0.4][randInt(0, 5)];
            return { q: `Write ${d} as a percentage.`, a: String(d * 100) };
          }
          if (mode === 2) {
            const p = [10, 20, 25, 50, 75][randInt(0, 4)];
            const n = [40, 60, 80, 120, 200][randInt(0, 4)];
            return { q: `${p}% of ${n} = ?`, a: String((p / 100) * n) };
          }
          const pairs = [["1/2", "0.5"], ["1/4", "0.25"], ["3/4", "0.75"], ["1/5", "0.2"]];
          const pick = pairs[randInt(0, pairs.length - 1)];
          return { q: `Write ${pick[0]} as a decimal.`, a: pick[1] };
        }
      },
      ratio: {
        label: "Ratio & Proportion",
        hint: "Scale both parts by the same factor.",
        makeQuestion() {
          const a = randInt(1, 5), b = randInt(2, 6), m = randInt(2, 5);
          return { q: `In the ratio ${a}:${b}, if first part is ${a * m}, second part is ?`, a: String(b * m) };
        }
      },
      algebra: {
        label: "Algebra",
        hint: "Undo operations in reverse order.",
        makeQuestion() {
          const x = randInt(2, 20), c = randInt(2, 12), d = randInt(1, 9);
          return { q: `Solve: x + ${d} = ${x + d}`, a: String(x) + " or " + String(x) };
        }
      },
      measurement: {
        label: "Measurement",
        hint: "Remember key conversions: 1000m=1km, 100cm=1m, 1000ml=1L.",
        makeQuestion() {
          const mode = randInt(1, 2);
          if (mode === 1) {
            const km = randInt(1, 8);
            return { q: `${km} km = ? m`, a: String(km * 1000) };
          }
          const l = randInt(2, 9);
          return { q: `${l} litres = ? ml`, a: String(l * 1000) };
        }
      },
      geometry: {
        label: "Geometry",
        hint: "Angles on a straight line total 180°.",
        makeQuestion() {
          const a = randInt(30, 150);
          return { q: `Angle A and B are on a straight line. If A=${a}°, B=?`, a: String(180 - a) };
        }
      }
    };

    const assessmentPlan = [
      "arithmetic", "arithmetic", "fractions", "fractions",
      "ratio", "algebra", "measurement", "measurement",
      "geometry", "geometry", "fractions", "arithmetic"
    ];

    const state = {
      assessmentIndex: -1,
      assessmentQuestions: [],
      scoreByTopic: Object.fromEntries(Object.keys(topics).map(t => [t, { right: 0, total: 0 }])),
      practiceTopic: null,
      practiceQuestion: null,
      streak: 0,
      assessmentAttempts: 0,
      practiceAttempts: 0
    };

    const $ = (id) => document.getElementById(id);

    function parseUserAnswer(raw) {
      return norm(raw.replace(/%/g, ""));
    }

    function isCorrect(user, answer) {
      const u = parseUserAnswer(user);
      if (!u) return false;
      const a = norm(answer);
      if (a.includes(" or ")) {
        return a.split(" or ").map(norm).includes(u);
      }
      const un = Number(u), an = Number(a);
      if (Number.isFinite(un) && Number.isFinite(an)) {
        return Math.abs(un - an) < 0.001;
      }
      return u === a;
    }

    function stepHint(topic, question, attempt) {
      if (topic === "arithmetic") {
        if (question.includes("+")) return attempt === 1 ? "Step 1: Add hundreds, then tens, then ones." : "Step 2: Recheck by subtracting your total from the bigger number.";
        if (question.includes("-")) return attempt === 1 ? "Step 1: Subtract hundreds, tens and ones carefully." : "Step 2: Check by adding your answer back.";
        return attempt === 1 ? "Step 1: Break multiplication into easier parts." : "Step 2: Use inverse division to check.";
      }
      if (topic === "fractions") {
        if (question.includes("percentage")) return attempt === 1 ? "Step 1: Multiply the decimal by 100." : "Step 2: Add the percent sign only after finding the number.";
        if (question.includes("% of")) return attempt === 1 ? "Step 1: Turn the percent into a decimal." : "Step 2: Multiply that decimal by the whole number.";
        return attempt === 1 ? "Step 1: Divide numerator by denominator." : "Step 2: Write the decimal to tenths or hundredths.";
      }
      if (topic === "ratio") return attempt === 1 ? "Step 1: Find the scale factor from the first part." : "Step 2: Multiply the second part by the same factor.";
      if (topic === "algebra") return attempt === 1 ? "Step 1: Isolate x by undoing the added number." : "Step 2: Put your x back into the equation to check.";
      if (topic === "measurement") return attempt === 1 ? "Step 1: Pick the conversion fact you need." : "Step 2: Use x1000 for km->m and L->ml.";
      if (topic === "geometry") return attempt === 1 ? "Step 1: Angles on a straight line total 180." : "Step 2: Subtract the known angle from 180.";
      return "Try solving it one operation at a time.";
    }

    function guidedMessage(topic, question, attempt) {
      const first = stepHint(topic, question, 1);
      const second = stepHint(topic, question, 2);
      if (attempt <= 1) return `Let's solve it step by step. 1) ${first}`;
      return `Let's solve it step by step. 1) ${first} 2) ${second} 3) Try again with your new working.`;
    }

    function nextAssessmentQuestion() {
      state.assessmentIndex += 1;
      if (state.assessmentIndex >= assessmentPlan.length) {
        showResults();
        return;
      }
      const topic = assessmentPlan[state.assessmentIndex];
      const q = topics[topic].makeQuestion();
      state.assessmentQuestions[state.assessmentIndex] = { ...q, topic };
      state.assessmentAttempts = 0;
      $("assessmentProgress").textContent = `Question ${state.assessmentIndex + 1} of ${assessmentPlan.length}`;
      $("assessmentQuestion").textContent = q.q;
      $("assessmentAnswer").value = "";
      $("assessmentAnswer").focus();
      $("assessmentStatus").textContent = "";
      $("assessmentStatus").className = "status";
    }

    function submitAssessment() {
      const entry = state.assessmentQuestions[state.assessmentIndex];
      const user = $("assessmentAnswer").value;
      const correct = isCorrect(user, entry.a);
      const s = state.scoreByTopic[entry.topic];
      if (!entry.assessed) {
        s.total += 1;
        if (correct) s.right += 1;
        entry.assessed = true;
      }

      const status = $("assessmentStatus");
      status.className = `status ${correct ? "good" : "bad"}`;
      if (correct) {
        status.textContent = "Nice work! Correct.";
        setTimeout(nextAssessmentQuestion, 550);
      } else {
        status.textContent = `Not quite. Correct answer: ${entry.a}`;
        setTimeout(nextAssessmentQuestion, 900);
      }
    }

    function showResults() {
      $("assessmentBox").classList.add("hidden");
      $("resultsBox").classList.remove("hidden");

      let totalRight = 0, totalQ = 0;
      for (const key of Object.keys(state.scoreByTopic)) {
        totalRight += state.scoreByTopic[key].right;
        totalQ += state.scoreByTopic[key].total;
      }
      const pct = Math.round((totalRight / Math.max(totalQ, 1)) * 100);
      $("scoreLine").innerHTML = `<p><strong>Total score:</strong> ${totalRight}/${totalQ} (${pct}%)</p>`;

      const box = $("topicSummary");
      box.innerHTML = "";
      const topicOrder = Object.keys(topics).sort((a, b) => {
        const pa = state.scoreByTopic[a].total ? state.scoreByTopic[a].right / state.scoreByTopic[a].total : 1;
        const pb = state.scoreByTopic[b].total ? state.scoreByTopic[b].right / state.scoreByTopic[b].total : 1;
        return pa - pb;
      });

      for (const key of topicOrder) {
        const t = state.scoreByTopic[key];
        const topicPct = t.total ? Math.round((t.right / t.total) * 100) : 0;
        const card = document.createElement("div");
        card.className = "topic-card";
        card.innerHTML = `<div class="topic-title">${topics[key].label}</div><div class="small">${t.right}/${t.total} correct (${topicPct}%)</div>`;
        box.appendChild(card);
      }

      const picker = $("practiceTopic");
      picker.innerHTML = "";
      for (const key of topicOrder) {
        const o = document.createElement("option");
        o.value = key;
        o.textContent = topics[key].label;
        picker.appendChild(o);
      }
    }

    function newPracticeQuestion() {
      const topic = state.practiceTopic;
      const q = topics[topic].makeQuestion();
      state.practiceQuestion = q;
      state.practiceAttempts = 0;
      $("practiceQuestion").textContent = q.q;
      $("practiceAnswer").value = "";
      $("practiceStatus").textContent = "";
      $("practiceStatus").className = "status";
      $("practiceHint").textContent = `Tip: ${topics[topic].hint}`;
      $("practiceAnswer").focus();
    }

    function submitPractice() {
      const user = $("practiceAnswer").value;
      const ok = isCorrect(user, state.practiceQuestion.a);
      if (ok) state.streak += 1;
      else {
        state.streak = 0;
        state.practiceAttempts += 1;
      }

      $("streak").textContent = `Streak: ${state.streak}`;
      const status = $("practiceStatus");
      status.className = `status ${ok ? "good" : "bad"}`;
      status.textContent = ok
        ? "Correct. Great momentum."
        : guidedMessage(state.practiceTopic, state.practiceQuestion.q, state.practiceAttempts);
    }

    $("startAssessment").addEventListener("click", () => {
      $("intro").classList.add("hidden");
      $("assessmentBox").classList.remove("hidden");
      nextAssessmentQuestion();
    });

    $("assessmentSubmit").addEventListener("click", submitAssessment);
    $("assessmentAnswer").addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitAssessment();
    });

    $("beginPractice").addEventListener("click", () => {
      state.practiceTopic = $("practiceTopic").value;
      state.streak = 0;
      $("resultsBox").classList.add("hidden");
      $("practiceBox").classList.remove("hidden");
      $("streak").textContent = "Streak: 0";
      newPracticeQuestion();
    });

    $("practiceSubmit").addEventListener("click", submitPractice);
    $("practiceAnswer").addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitPractice();
    });
    $("nextPractice").addEventListener("click", newPracticeQuestion);
  </script>
</body>
</html>
