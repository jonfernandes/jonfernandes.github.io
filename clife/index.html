<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Life</title>
    <style>
        :root {
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --input-bg: #ffffff;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --card: #1e293b;
                --text: #e2e8f0;
                --muted: #94a3b8;
                --border: #334155;
                --input-bg: #0f172a;
                --accent: #818cf8;
                --accent-hover: #6366f1;
            }
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            padding: 28px 16px 56px;
        }

        .container { max-width: 680px; margin: 0 auto; }

        h1 {
            font-size: clamp(1.8rem, 5vw, 2.6rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 6px;
        }
        .subtitle { color: var(--muted); margin-bottom: 32px; font-size: 1rem; }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px 24px;
            margin-bottom: 24px;
        }

        .section-label {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { margin-bottom: 20px; }
        .form-group:last-child { margin-bottom: 0; }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            margin-bottom: 7px;
        }

        input, select {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
            -webkit-appearance: none;
            appearance: none;
        }
        input:focus, select:focus { border-color: var(--accent); }

        .hidden { display: none !important; }

        .add-btn {
            padding: 9px 16px;
            border: 1.5px dashed var(--border);
            border-radius: 8px;
            background: transparent;
            color: var(--muted);
            font-size: 0.875rem;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
            margin-top: 4px;
        }
        .add-btn:hover { border-color: var(--accent); color: var(--accent); }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s;
            margin-top: 28px;
            letter-spacing: 0.01em;
        }
        .submit-btn:hover { background: var(--accent-hover); }

        .chart-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .chart-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 3px; }
        .chart-meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 16px; }

        canvas {
            display: block;
            width: 100%;
            max-width: 420px;
            height: auto;
        }
        canvas.wide { max-width: 100%; }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 18px;
            margin-top: 14px;
            font-size: 0.78rem;
            color: var(--muted);
        }
        .legend-item { display: flex; align-items: center; gap: 7px; }
        .legend-swatch {
            width: 13px; height: 13px;
            border-radius: 3px;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        @media (max-width: 480px) {
            .form-row { grid-template-columns: 1fr; }
            .card, .chart-card { padding: 20px 16px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Your life</h1>
    <p class="subtitle">A visual map of your time on earth.</p>

    <div class="card">
        <form id="lifeForm" onsubmit="generate(event)">
            <div class="section-label">About you</div>
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" required placeholder="Your name">
                </div>
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" min="1" max="120" required placeholder="e.g. 35">
                </div>
            </div>
            <div class="form-group">
                <label for="sex">Sex</label>
                <select id="sex">
                    <option value="M">Male</option>
                    <option value="F">Female</option>
                </select>
            </div>

            <div class="section-label" style="margin-top:28px;">Parents</div>
            <div class="form-row">
                <div class="form-group">
                    <label for="mother_alive">Mother alive?</label>
                    <select id="mother_alive" onchange="toggleDiv('mother_age_div',this.value)">
                        <option value="no">No</option>
                        <option value="yes">Yes</option>
                    </select>
                </div>
                <div class="form-group hidden" id="mother_age_div">
                    <label for="mother_age">Mother's age</label>
                    <input type="number" id="mother_age" min="1" max="120" placeholder="e.g. 65">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="father_alive">Father alive?</label>
                    <select id="father_alive" onchange="toggleDiv('father_age_div',this.value)">
                        <option value="no">No</option>
                        <option value="yes">Yes</option>
                    </select>
                </div>
                <div class="form-group hidden" id="father_age_div">
                    <label for="father_age">Father's age</label>
                    <input type="number" id="father_age" min="1" max="120" placeholder="e.g. 68">
                </div>
            </div>

            <div class="section-label" style="margin-top:28px;">Children</div>
            <div class="form-group">
                <label for="has_children">Do you have children?</label>
                <select id="has_children" onchange="toggleDiv('children_div',this.value)">
                    <option value="no">No</option>
                    <option value="yes">Yes</option>
                </select>
            </div>
            <div id="children_div" class="hidden">
                <div id="children_entries"></div>
                <button type="button" class="add-btn" id="add_child_button" onclick="addChild()">+ Add child</button>
            </div>

            <button type="submit" class="submit-btn">Visualise →</button>
        </form>
    </div>

    <div id="results"></div>
</div>

<script>
    const DARK = window.matchMedia('(prefers-color-scheme: dark)').matches;

    const C = {
        empty:          DARK ? '#1e293b' : '#ffffff',
        gridLine:       DARK ? '#334155' : '#1e293b',
        text:           DARK ? '#94a3b8' : '#1e293b',
        growFill:       DARK ? '#475569' : '#9ca3af',
        maleFill:       '#3b82f6',
        femaleFill:     '#ec4899',
        maleRemain:     DARK ? '#1e3a5f' : '#bfdbfe',
        femaleRemain:   DARK ? '#4a1530' : '#fce7f3',
        selfRemain:     DARK ? '#374151' : '#d1d5db',
        bonus:          '#f59e0b',
        childMaleRemain:   DARK ? '#1e3a5f' : '#bfdbfe',
        childFemaleRemain: DARK ? '#4c1d2c' : '#fee2e2',
        childFemaleFill:   '#ef4444',
    };

    let childCount = 0;

    function toggleDiv(id, value) {
        document.getElementById(id).classList.toggle('hidden', value !== 'yes');
    }

    function addChild() {
        childCount++;
        const n = childCount;
        const div = document.createElement('div');
        div.id = 'child_div_' + n;
        div.className = 'form-row';
        div.style.marginBottom = '16px';
        div.innerHTML = `
            <div class="form-group">
                <label for="child_age_${n}">Child ${n} age</label>
                <input type="number" id="child_age_${n}" name="child_age" min="0" max="17" placeholder="e.g. 8">
            </div>
            <div class="form-group">
                <label for="child_sex_${n}">Child ${n} sex</label>
                <select id="child_sex_${n}" name="child_sex">
                    <option value="M">Male</option>
                    <option value="F">Female</option>
                </select>
            </div>
        `;
        document.getElementById('add_child_button').insertAdjacentElement('beforebegin', div);
    }

    function normalRandom(mean, std) {
        let u = 0, v = 0;
        while (u === 0) u = Math.random();
        while (v === 0) v = Math.random();
        return mean + std * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }

    function makeCanvas(w, h, cssClass) {
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.style.aspectRatio = `${w} / ${h}`;
        if (cssClass) canvas.className = cssClass;
        return canvas;
    }

    // 10×10 life grid. Cells beyond life expectancy show in amber if the
    // person has already exceeded it.
    function drawLifeGrid(age, lifeExp, filledColor, remainColor) {
        const cell = 44;
        const canvas = makeCanvas(10 * cell, 10 * cell);
        const ctx = canvas.getContext('2d');

        for (let i = 0; i < 100; i++) {
            const x = (i % 10) * cell;
            const y = Math.floor(i / 10) * cell;

            let fill;
            if (i < Math.min(age, lifeExp))    fill = filledColor;
            else if (i < age)                   fill = C.bonus;       // lived past expectancy
            else if (i < lifeExp)               fill = remainColor;   // expected future
            else                                fill = C.empty;

            ctx.fillStyle = fill;
            ctx.fillRect(x, y, cell, cell);
            ctx.strokeStyle = C.gridLine;
            ctx.lineWidth = 0.8;
            ctx.strokeRect(x + 0.5, y + 0.5, cell - 1, cell - 1);
        }
        return canvas;
    }

    function drawGrowingUp(age) {
        const visitWeeks = 4;
        const rows = age + 1;
        const cols = 52;
        const yob = new Date().getFullYear() - age - 1;

        const grid = Array.from({ length: rows }, () => new Uint8Array(cols));
        for (let r = Math.max(0, rows - 20); r < rows; r++) grid[r].fill(1);
        for (let i = 0; i < age - 19; i++) {
            const weeks = Math.round(Math.max(0, Math.min(visitWeeks, normalRandom(visitWeeks, 1))));
            grid[i].fill(1, 0, weeks);
        }

        const cw = 12, ch = 18, lw = 46;
        const canvas = makeCanvas(lw + cols * cw, rows * ch, 'wide');
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = C.empty;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const x = lw + c * cw, y = r * ch;
                ctx.fillStyle = grid[r][c] ? C.growFill : C.empty;
                ctx.fillRect(x, y, cw, ch);
                ctx.strokeStyle = C.gridLine;
                ctx.lineWidth = 0.4;
                ctx.strokeRect(x + 0.5, y + 0.5, cw - 1, ch - 1);
            }
        }

        ctx.fillStyle = C.text;
        ctx.font = '10px monospace';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        for (let r = 0; r < rows; r++) {
            ctx.fillText(yob + rows - r, lw - 4, r * ch + ch / 2);
        }
        return canvas;
    }

    function chartCard(title, meta, canvas, legend) {
        const div = document.createElement('div');
        div.className = 'chart-card';
        div.innerHTML = `<div class="chart-title">${title}</div><div class="chart-meta">${meta}</div>`;
        div.appendChild(canvas);
        if (legend.length) {
            const leg = document.createElement('div');
            leg.className = 'legend';
            legend.forEach(({ color, label }) => {
                leg.innerHTML += `<span class="legend-item"><span class="legend-swatch" style="background:${color}"></span>${label}</span>`;
            });
            div.appendChild(leg);
        }
        return div;
    }

    function lifeGridCard(title, age, lifeExp, filledColor, remainColor) {
        const legend = [
            { color: filledColor, label: `Years lived (${Math.min(age, lifeExp)})` },
        ];
        if (age > lifeExp) {
            legend.push({ color: C.bonus, label: `Beyond expectancy (+${age - lifeExp})` });
        } else {
            legend.push({ color: remainColor, label: `Expected future (${lifeExp - age})` });
        }
        return chartCard(
            title,
            `Life expectancy: ${lifeExp} · Age: ${age}`,
            drawLifeGrid(age, lifeExp, filledColor, remainColor),
            legend
        );
    }

    function generate(e) {
        e.preventDefault();

        const name   = document.getElementById('name').value;
        const age    = parseInt(document.getElementById('age').value);
        const sex    = document.getElementById('sex').value;
        const mAlive = document.getElementById('mother_alive').value;
        const mAge   = mAlive === 'yes' ? parseInt(document.getElementById('mother_age').value) : null;
        const fAlive = document.getElementById('father_alive').value;
        const fAge   = fAlive === 'yes' ? parseInt(document.getElementById('father_age').value) : null;

        const cAgeEls = document.querySelectorAll('[name="child_age"]');
        const cSexEls = document.querySelectorAll('[name="child_sex"]');
        const children = Array.from(cAgeEls).map((el, i) => ({
            age: parseInt(el.value) || 0,
            sex: cSexEls[i].value,
        }));

        const results = document.getElementById('results');
        results.innerHTML = '';

        const lifeExp     = sex === 'M' ? 79 : 81;
        const filledColor = sex === 'M' ? C.maleFill : C.femaleFill;

        results.appendChild(lifeGridCard(name, age, lifeExp, filledColor, C.selfRemain));

        if (mAlive === 'yes' && mAge != null && !isNaN(mAge)) {
            results.appendChild(lifeGridCard('Your mother', mAge, 81, C.femaleFill, C.femaleRemain));
        }

        if (fAlive === 'yes' && fAge != null && !isNaN(fAge)) {
            results.appendChild(lifeGridCard('Your father', fAge, 79, C.maleFill, C.maleRemain));
        }

        if (mAlive === 'yes' || fAlive === 'yes') {
            results.appendChild(chartCard(
                'Growing up',
                'Weeks spent with parents each year — each cell = 1 week',
                drawGrowingUp(age),
                [
                    { color: C.growFill, label: 'Weeks together' },
                    { color: C.empty,    label: 'Weeks apart' },
                ]
            ));
        }

        children.forEach((child) => {
            const cf = child.sex === 'M' ? C.maleFill : C.childFemaleFill;
            const cr = child.sex === 'M' ? C.childMaleRemain : C.childFemaleRemain;
            results.appendChild(lifeGridCard('Your child', child.age, 18, cf, cr));
        });
    }
</script>
</body>
</html>
